<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silent Ledger — Privacy-First Bitcoin Payment Layer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    background:
        radial-gradient(circle at 85% 10%, rgba(247, 147, 26, 0.22), transparent 30%),
        radial-gradient(circle at 10% 90%, rgba(157, 78, 221, 0.28), transparent 30%),
        linear-gradient(135deg, #06070a, #0d0f17, #131422, #1b172a);
    color: #fff;
}

/* =========================
   AMBIENT BACKGROUND GLOWS
   ========================= */
.glow1, .glow2, .glow3 {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.glow1 {
    width: 380px;
    height: 380px;
    background: #f7931a;
    top: -180px;
    right: -140px;
    filter: blur(100px);
    opacity: 0.25;
}

.glow2 {
    width: 380px;
    height: 380px;
    background: #9d4edd;
    bottom: -180px;
    left: -150px;
    filter: blur(100px);
    opacity: 0.3;
}

.glow3 {
    width: 260px;
    height: 260px;
    background: #ffaa3b;
    top: 45%;
    right: -130px;
    filter: blur(110px);
    opacity: 0.12;
}

/* =========================
   GRID
   ========================= */
.grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 55px 55px;
    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 25%,
        black 75%,
        transparent
    );
}

/* =========================
   FLOATING STARS
   ========================= */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.3;
    animation: twinkle 3s infinite ease-in-out;
}
.s1 { top: 18%; left: 22%; animation-delay: 0.2s; }
.s2 { top: 72%; left: 16%; animation-delay: 1.1s; }
.s3 { top: 35%; right: 20%; animation-delay: 1.8s; }
.s4 { bottom: 25%; right: 28%; animation-delay: 2.4s; }
.s5 { top: 82%; right: 12%; animation-delay: 0.7s; }

@keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 0.9; transform: scale(1.4); }
}

/* =========================
   TOP BRAND
   ========================= */
.brand {
    position: absolute;
    top: 32px;
    left: 40px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #f7931a, #ffaa3b);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    font-weight: 900;
    font-size: 18px;
    box-shadow: 0 0 15px rgba(247, 147, 26, 0.4);
}

/* =========================
   GLASS CONTAINER
   ========================= */
.container {
    width: 460px;
    max-width: 92vw;
    padding: 42px 36px;
    border-radius: 28px;
    background: rgba(18, 21, 28, 0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.65),
        0 0 40px rgba(247, 147, 26, 0.06);
    text-align: center;
    position: relative;
    z-index: 10;
}

/* LOGO BOX */
.logo-box {
    width: 90px;
    height: 90px;
    margin: 0 auto 20px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(247, 147, 26, 0.45);
    animation: rotateRing 20s linear infinite;
}

@keyframes rotateRing {
    100% { transform: rotate(360deg); }
}

.logo-core {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    background: linear-gradient(135deg, #1b1e2a, #0c0e14);
    border: 1px solid rgba(247, 147, 26, 0.4);
    box-shadow: 0 0 25px rgba(247, 147, 26, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
    color: #f7931a;
}

/* BADGE */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    margin-bottom: 14px;
    border-radius: 30px;
    background: rgba(247, 147, 26, 0.1);
    border: 1px solid rgba(247, 147, 26, 0.3);
    color: #ffaa3b;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
}

.badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f7931a;
    box-shadow: 0 0 8px #f7931a;
    animation: pulse 1.8s infinite;
}

@keyframes pulse {
    50% { opacity: 0.4; transform: scale(0.7); }
}

/* TEXT */
h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
}

.subtitle {
    font-size: 14px;
    color: #9ca3af;
    margin-bottom: 22px;
}

/* TABS FOR LOGIN / SIGNUP */
.auth-tabs {
    display: flex;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.auth-tab {
    flex: 1;
    padding: 9px;
    border: none;
    background: transparent;
    color: #9ca3af;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s ease;
}

.auth-tab.active {
    background: #252b3b;
    color: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
}

/* FORM INPUTS */
.input-group {
    margin-bottom: 14px;
    text-align: left;
}

.input-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #d1d5db;
    margin-bottom: 6px;
}

.input-field {
    width: 100%;
    padding: 13px 16px;
    background: rgba(7, 9, 13, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: all 0.25s ease;
}

.input-field:focus {
    border-color: #f7931a;
    box-shadow: 0 0 15px rgba(247, 147, 26, 0.2);
}

.input-field::placeholder {
    color: #6b7280;
}

/* SUBMIT BUTTON */
.btn-submit {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(135deg, #f7931a, #ffaa3b);
    color: #000;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 0 20px rgba(247, 147, 26, 0.35);
}

.btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 28px rgba(247, 147, 26, 0.55);
}

.btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* NOTIFICATION / ALERT MESSAGE */
.alert-box {
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 500;
    display: none;
    text-align: left;
}

.alert-box.success {
    display: block;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #34d399;
}

.alert-box.error {
    display: block;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #f87171;
}

/* FOOTER */
.footer-text {
    margin-top: 22px;
    font-size: 11.5px;
    color: #6b7280;
    letter-spacing: 0.3px;
}

.db-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 11px;
    color: #10b981;
}
.db-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
}
</style>
</head>

<body>

<!-- AMBIENT GLOWS -->
<div class="glow1"></div>
<div class="glow2"></div>
<div class="glow3"></div>
<div class="grid"></div>

<!-- STARS -->
<div class="star s1"></div>
<div class="star s2"></div>
<div class="star s3"></div>
<div class="star s4"></div>
<div class="star s5"></div>

<!-- BRAND -->
<div class="brand">
    <div class="brand-icon">₿</div>
    <span>Silent Ledger</span>
</div>

<!-- CARD -->
<div class="container">

    <!-- LOGO -->
    <div class="logo-box">
        <div class="logo-ring"></div>
        <div class="logo-core">₿</div>
    </div>

    <!-- BADGE -->
    <div class="badge">
        <span class="badge-dot"></span>
        Privacy-First Bitcoin Layer
    </div>

    <!-- TITLE -->
    <h1 id="formHeading">Welcome to Silent Ledger</h1>
    <p class="subtitle" id="formSubheading">Sign in with your MongoDB Atlas account</p>

    <!-- TABS -->
    <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin" onclick="setMode('login')">Sign In</button>
        <button type="button" class="auth-tab" id="tabSignup" onclick="setMode('signup')">Create Account</button>
    </div>

    <!-- FORM -->
    <form id="authForm" onsubmit="handleAuth(event)">
        <div class="input-group">
            <label class="input-label" for="email">Email Address</label>
            <input type="email" id="email" class="input-field" placeholder="testuser@bitcoinapp.com" required autocomplete="email">
        </div>

        <div class="input-group">
            <label class="input-label" for="password">Password</label>
            <input type="password" id="password" class="input-field" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
    </form>

    <!-- STATUS ALERT -->
    <div id="alertBox" class="alert-box"></div>

    <!-- FOOTER -->
    <div class="footer-text">
        Zero-Knowledge Verification • Powered by Express & MongoDB Atlas
    </div>

    <div class="db-pill">
        <span class="db-dot"></span>
        <span>Connected to MongoDB Service (/api/signup & /api/login)</span>
    </div>

</div>

<script>
    let currentMode = 'login'; // 'login' or 'signup'

    function setMode(mode) {
        currentMode = mode;
        const tabLogin = document.getElementById('tabLogin');
        const tabSignup = document.getElementById('tabSignup');
        const formHeading = document.getElementById('formHeading');
        const formSubheading = document.getElementById('formSubheading');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        alertBox.className = 'alert-box';
        alertBox.style.display = 'none';

        if (mode === 'login') {
            tabLogin.classList.add('active');
            tabSignup.classList.remove('active');
            formHeading.innerText = 'Welcome Back';
            formSubheading.innerText = 'Sign in to access your Silent Ledger dashboard';
            submitBtn.innerText = 'Sign In';
        } else {
            tabSignup.classList.add('active');
            tabLogin.classList.remove('active');
            formHeading.innerText = 'Create Account';
            formSubheading.innerText = 'Register new user account in MongoDB Atlas';
            submitBtn.innerText = 'Create Silent Ledger Account';
        }
    }

    async function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        if (!email || !password) {
            showAlert('Please enter both email and password.', 'error');
            return;
        }

        submitBtn.disabled = true;
        const endpoint = currentMode === 'signup' ? '/api/signup' : '/api/login';

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                showAlert(data.message || (currentMode === 'signup' ? 'Registered successfully!' : 'Login successful!'), 'success');

                // Store session
                if (data.user) {
                    localStorage.setItem('silentLedger_userEmail', data.user.email);
                    localStorage.setItem('silentLedger_userId', data.user.id);
                }

                // Redirect after brief notification
                setTimeout(() => {
                    window.location.href = '/';
                }, 1200);
            } else {
                showAlert(data.message || data.error || 'Authentication failed. Please check credentials.', 'error');
            }
        } catch (err) {
            showAlert('Network error: ' + err.message + '. Ensure backend is running on port 5000.', 'error');
        } finally {
            submitBtn.disabled = false;
        }
    }

    function showAlert(msg, type) {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = 'alert-box ' + type;
        alertBox.innerText = msg;
    }
</script>

</body>
</html>
