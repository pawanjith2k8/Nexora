<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;

    background:
    radial-gradient(circle at 85% 10%,rgba(192,38,211,.35),transparent 25%),
    radial-gradient(circle at 10% 90%,rgba(126,34,206,.35),transparent 25%),
    linear-gradient(135deg,#08000f,#140025,#240044,#31005c);
}

/* =========================
   AMBIENT BACKGROUND
   ========================= */

.glow1,
.glow2,
.glow3{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.glow1{
    width:360px;
    height:360px;
    background:#c026d3;
    top:-180px;
    right:-140px;
    filter:blur(90px);
    opacity:.35;
}

.glow2{
    width:350px;
    height:350px;
    background:#7e22ce;
    bottom:-180px;
    left:-150px;
    filter:blur(90px);
    opacity:.4;
}

.glow3{
    width:250px;
    height:250px;
    background:#e879f9;
    top:45%;
    right:-150px;
    filter:blur(110px);
    opacity:.12;
}


/* =========================
   GRID
   ========================= */

.grid{
    position:absolute;
    inset:0;
    pointer-events:none;

    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);

    background-size:55px 55px;

    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 25%,
        black 75%,
        transparent
    );
}


/* =========================
   STARS
   ========================= */

.star{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 12px white;
    opacity:.7;
    animation:twinkle 3s infinite alternate;
}

.s1{top:15%;left:12%;}
.s2{top:20%;right:18%;animation-delay:.8s;}
.s3{bottom:18%;right:10%;animation-delay:1.5s;}
.s4{bottom:25%;left:15%;animation-delay:2s;}
.s5{top:45%;left:8%;animation-delay:.4s;}
.s6{top:65%;right:15%;animation-delay:1.2s;}
.s7{top:12%;left:42%;animation-delay:1.8s;}

@keyframes twinkle{
    from{
        opacity:.25;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1.3);
    }
}


/* =========================
   NEXORA BRAND
   ========================= */

.brand{
    position:absolute;
    top:25px;
    left:35px;

    font-size:48px;
    font-weight:800;
    letter-spacing:-2px;

    background:linear-gradient(
        90deg,
        #f5d0fe,
        #e879f9,
        #a855f7,
        #7e22ce
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
        0 0 30px rgba(217,70,239,.5);

    z-index:5;
}


/* =========================
   LOGIN CARD
   ========================= */

.container{
    width:620px;
    padding:50px;

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.035)
        );

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    border:1px solid rgba(255,255,255,.16);

    border-radius:40px;

    box-shadow:
        0 0 80px rgba(168,85,247,.25),
        0 30px 100px rgba(0,0,0,.35),
        inset 0 0 30px rgba(255,255,255,.025);

    text-align:center;
    color:white;

    z-index:10;

    animation:cardAppear .8s ease-out;
}

@keyframes cardAppear{
    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}


/* TOP CARD SHINE */

.container::before{
    content:"";
    position:absolute;

    top:0;
    left:15%;

    width:70%;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.7),
        transparent
    );
}


/* =========================
   CUSTOM NEXORA LOGO
   ========================= */

.logo-box{
    width:170px;
    height:170px;

    margin:0 auto 28px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* outer glowing ring */

.logo-ring{
    position:absolute;
    inset:0;

    border-radius:50%;

    background:conic-gradient(
        from 0deg,
        #7e22ce,
        #d946ef,
        #f0abfc,
        #9333ea,
        #7e22ce
    );

    animation:rotateRing 8s linear infinite;

    box-shadow:
        0 0 25px rgba(217,70,239,.5),
        0 0 60px rgba(147,51,234,.3);
}

.logo-ring::after{
    content:"";
    position:absolute;
    inset:3px;

    border-radius:50%;

    background:#160027;
}


/* logo glass center */

.logo-core{
    position:relative;

    width:135px;
    height:135px;

    border-radius:35px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.03)
        );

    border:1px solid rgba(255,255,255,.18);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        inset 0 0 25px rgba(255,255,255,.05),
        0 0 30px rgba(168,85,247,.35);

    transform:rotate(45deg);
}


/* N symbol */

.n-symbol{
    width:65px;
    height:65px;

    position:relative;

    transform:rotate(-45deg);
}


/* N left/right bars */

.n-symbol::before,
.n-symbol::after{
    content:"";

    position:absolute;

    width:13px;
    height:65px;

    border-radius:10px;

    background:linear-gradient(
        180deg,
        #f5d0fe,
        #d946ef,
        #9333ea
    );

    box-shadow:
        0 0 12px rgba(217,70,239,.8);
}

.n-symbol::before{
    left:5px;
}

.n-symbol::after{
    right:5px;
}


/* diagonal N */

.n-diagonal{
    position:absolute;

    width:13px;
    height:72px;

    left:26px;
    top:-3px;

    border-radius:10px;

    background:linear-gradient(
        180deg,
        #ffffff,
        #e879f9,
        #a855f7
    );

    transform:rotate(-38deg);

    box-shadow:
        0 0 15px rgba(232,121,249,.9);
}


@keyframes rotateRing{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   SMALL BADGE
   ========================= */

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:7px 14px;

    margin-bottom:18px;

    border-radius:30px;

    background:rgba(217,70,239,.09);

    border:1px solid rgba(232,121,249,.2);

    color:#f0abfc;

    font-size:12px;
    font-weight:500;

    letter-spacing:.5px;
}

.badge-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#e879f9;

    box-shadow:0 0 10px #e879f9;

    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    50%{
        opacity:.35;
        transform:scale(.65);
    }
}


/* =========================
   TEXT
   ========================= */

h1{
    font-size:48px;
    font-weight:700;
    letter-spacing:-1.5px;

    margin-bottom:10px;
}

.subtitle{
    font-size:18px;

    color:#e9d5ff;

    margin-bottom:25px;
}


/* =========================
   DIVIDER
   ========================= */

.line{
    width:130px;
    height:4px;

    margin:0 auto 35px;

    border-radius:20px;

    background:linear-gradient(
        90deg,
        #c026d3,
        #f0abfc,
        #9333ea
    );

    box-shadow:
        0 0 20px #d946ef;
}


/* =========================
   GOOGLE BUTTON
   ========================= */

.google{
    width:100%;

    padding:21px;

    border:none;
    border-radius:18px;

    font-size:22px;
    font-weight:600;

    background:white;
    color:#111827;

    cursor:pointer;

    position:relative;
    overflow:hidden;

    transition:.3s;
}

.google::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:60%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.8),
        transparent
    );

    transform:skewX(-20deg);

    transition:.6s;
}

.google:hover::before{
    left:140%;
}

.google:hover{
    transform:translateY(-4px);

    box-shadow:
        0 15px 35px rgba(255,255,255,.16),
        0 0 25px rgba(217,70,239,.15);
}

.google:active{
    transform:translateY(-1px);
}


/* =========================
   MESSAGE
   ========================= */

.nexora-message{
    margin-top:22px;

    color:#d8b4fe;

    font-size:15px;

    letter-spacing:.4px;

    opacity:.9;
}


/* =========================
   BOTTOM MINI TEXT
   ========================= */

.footer-text{
    margin-top:25px;

    font-size:11px;

    color:rgba(255,255,255,.38);

    letter-spacing:1.5px;

    text-transform:uppercase;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:768px){

    body{
        overflow:auto;
        padding:80px 0 30px;
    }

    .brand{
        top:20px;
        left:22px;
        font-size:34px;
    }

    .container{
        width:90%;
        padding:32px 25px;
        border-radius:30px;
    }

    .logo-box{
        width:135px;
        height:135px;
        margin-bottom:22px;
    }

    .logo-core{
        width:108px;
        height:108px;
        border-radius:28px;
    }

    .n-symbol{
        transform:rotate(-45deg) scale(.8);
    }

    h1{
        font-size:34px;
    }

    .subtitle{
        font-size:15px;
    }

    .google{
        font-size:18px;
        padding:18px;
    }

    .nexora-message{
        font-size:13px;
    }
}

</style>
</head>


<body>

<!-- BACKGROUND -->
<div class="glow1"></div>
<div class="glow2"></div>
<div class="glow3"></div>

<div class="grid"></div>

<!-- STARS -->
<div class="star s1"></div>
<div class="star s2"></div>
<div class="star s3"></div>
<div class="star s4"></div>
<div class="star s5"></div>
<div class="star s6"></div>
<div class="star s7"></div>


<!-- BRAND -->
<div class="brand">Nexora</div>


<!-- LOGIN CARD -->
<div class="container">


    <!-- CUSTOM LOGO -->
    <div class="logo-box">

        <div class="logo-ring"></div>

        <div class="logo-core">

            <div class="n-symbol">
                <div class="n-diagonal"></div>
            </div>

        </div>

    </div>


    <!-- BADGE -->
    <div class="badge">
        <span class="badge-dot"></span>
        NEXT GENERATION PLATFORM
    </div>


    <!-- TITLE -->
    <h1>Welcome to Nexora</h1>


    <p class="subtitle">
        Login or register to continue
    </p>


    <div class="line"></div>


    <!-- GOOGLE LOGIN -->
    <button class="google" id="googleSignIn">
        Continue with Google
    </button>


    <!-- QUOTE -->
    <div class="nexora-message">
        Build smarter. Move forward.
    </div>


    <div class="footer-text">
        Secure access • Powered by Nexora
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
   ========================================== */

const firebaseConfig = {
    apiKey: "AIzaSyCmXu28S-Bq67uFLwP_l_gWuHV1ml-IL1s",
    authDomain: "hackathon-bossbattle.firebaseapp.com",
    projectId: "hackathon-bossbattle",
    storageBucket: "hackathon-bossbattle.firebasestorage.app",
    messagingSenderId: "740266406975",
    appId: "1:740266406975:web:11e3d0d41081b20e26348a",
    measurementId: "G-7YD9N0825D"
};


/* ==========================================
   INITIALIZE FIREBASE
   ========================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


/* ==========================================
   GOOGLE LOGIN
   ========================================== */

document
.getElementById("googleSignIn")
.addEventListener("click", async () => {

    try {

        const result =
            await signInWithPopup(auth, provider);

        const user = result.user;


        /* USER DATA */

        localStorage.setItem(
            "userUID",
            user.uid
        );

        localStorage.setItem(
            "userName",
            user.displayName || ""
        );

        localStorage.setItem(
            "userEmail",
            user.email || ""
        );

        localStorage.setItem(
            "userPicture",
            user.photoURL || ""
        );


        /* FIRESTORE USER */

        const userRef =
            doc(db, "users", user.uid);

        const userSnap =
            await getDoc(userRef);


        /* =========================
           NEW USER
           ========================= */

        if (!userSnap.exists()) {

            await setDoc(
                userRef,
                {
                    uid: user.uid,

                    name:
                        user.displayName || "",

                    email:
                        user.email,

                    photoURL:
                        user.photoURL || "",

                    role:
                        "Resident",

                    status:
                        "Pending"
                },
                {
                    merge: true
                }
            );


            window.location.href =
                "location-register.html";

            return;
        }


        /* =========================
           EXISTING USER
           ========================= */

        const userData =
            userSnap.data();


        localStorage.setItem(
            "apartmentName",
            userData.apartmentName || ""
        );

        localStorage.setItem(
            "apartmentNumber",
            userData.apartmentNumber || ""
        );

        localStorage.setItem(
            "city",
            userData.city || ""
        );

        localStorage.setItem(
            "country",
            userData.country || ""
        );

        localStorage.setItem(
            "role",
            userData.role || ""
        );


        /* =========================
           ADMIN
           ========================= */

        if (userData.role === "Admin") {

            window.location.href =
                "adminpanel.html";

            return;
        }


        /* =========================
           SECURITY
           ========================= */

        if (userData.role === "Security") {

            window.location.href =
                "securitypanel.html";

            return;
        }


        /* =========================
           RESIDENT
           ========================= */

        if (userData.role === "Resident") {

            if (
                userData.status ===
                "Approved"
            ) {

                window.location.href =
                    "dashboard.html";

            } else {

                alert(
                    "Your account is waiting for admin approval."
                );

            }

            return;
        }

    }

    catch (error) {

        console.error("Login error:", error);

        alert(error.message);

    }

});

</script>

</body>
</html>
